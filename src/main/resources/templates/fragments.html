<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | StockSim'">StockSim</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<th:block th:fragment="header(active)">
    <header class="topbar">
        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <polyline points="2,18 8,11 13,15 22,5" fill="none" stroke="currentColor" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Stock<b>Sim</b></span>
        </a>
        <nav class="nav">
            <a th:href="@{/}" th:classappend="${active == 'market'} ? 'active'">Rynek</a>
            <a th:href="@{/portfolio}" th:classappend="${active == 'portfolio'} ? 'active'">Portfel</a>
            <a th:href="@{/trades}" th:classappend="${active == 'trades'} ? 'active'">Transakcje</a>
        </nav>
        <form th:if="${traders != null and currentTrader != null}" class="account" method="post" th:action="@{/trader}">
            <div class="account-cash">
                <span>Wolne środki</span>
                <strong th:text="${@fmt.money(currentTrader.availableCash)} + ' zł'">0,00 zł</strong>
            </div>
            <label class="account-select">
                <span class="avatar" th:text="${#strings.substring(currentTrader.name, 0, 1)}">A</span>
                <select name="traderId" aria-label="Inwestor" onchange="this.form.submit()">
                    <option th:each="t : ${traders}" th:value="${t.id}" th:text="${t.name}"
                            th:selected="${t.id == currentTrader.id}"></option>
                </select>
            </label>
            <noscript><button type="submit">Zmień</button></noscript>
        </form>
    </header>
    <div class="tape" th:if="${tape != null and !tape.isEmpty()}">
        <div class="tape-track">
            <th:block th:each="round : ${#numbers.sequence(1, 4)}">
                <a th:each="c : ${tape}" class="tape-item" th:href="@{/companies/{t}(t=${c.ticker})}">
                    <b th:text="${c.ticker}">ALFA</b>
                    <span th:text="${@fmt.money(c.lastPrice)}">50,00</span>
                    <span th:class="'chg ' + ${c.trend()}"
                          th:text="${@fmt.percent(c.changePercent())}">+1,00%</span>
                </a>
            </th:block>
        </div>
    </div>
</th:block>

<div th:fragment="flash" class="flash-area">
    <div th:if="${success}" class="alert success" role="status">
        <span class="alert-icon">✓</span><span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert error" role="alert">
        <span class="alert-icon">!</span><span th:text="${error}"></span>
    </div>
</div>

<th:block th:fragment="sparkline(prices, trend)">
    <svg class="spark" th:classappend="${trend}" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="spark-area" th:with="pts=${@chart.area(prices, 300, 70)}" th:points="${pts}"/>
        <polyline class="spark-line" th:with="pts=${@chart.line(prices, 300, 70)}" th:points="${pts}"/>
    </svg>
</th:block>
</body>
</html>
