<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Historia transakcji')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <h1>Historia transakcji</h1>
    <table>
        <thead><tr><th>Nr</th><th>Czas</th><th>Spółka</th><th class="num">Cena</th><th class="num">Ilość</th><th class="num">Wartość</th><th>Kupujący</th><th>Sprzedający</th></tr></thead>
        <tbody>
        <tr th:each="t : ${trades}">
            <td th:text="${t.id}"></td>
            <td th:text="${@fmt.time(t.executedAt)}"></td>
            <td><a th:href="@{/companies/{c}(c=${t.company.ticker})}" th:text="${t.company.ticker}"></a></td>
            <td class="num" th:text="${@fmt.money(t.price)}"></td>
            <td class="num" th:text="${t.quantity}"></td>
            <td class="num" th:text="${@fmt.money(t.value)}"></td>
            <td th:text="${t.buyOrder.trader.name}"></td>
            <td th:text="${t.sellOrder.trader.name}"></td>
        </tr>
        <tr th:if="${trades.isEmpty()}"><td colspan="8" class="empty">jeszcze nie było transakcji</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
